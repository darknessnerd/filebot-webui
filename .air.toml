root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  # Customize binary, can setup environment variables when run your app.
  full_bin = "APP_ENV=dev ./tmp/main"
  # Add additional arguments when running binary (bin/full_bin). Will run './tmp/main hello world'.
  args_bin = ["--debug", "--log-level", "trace"]
  cmd = "go build -o ./tmp/main ./cmd/webui-be"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = true
  include_dir = ["internal", "cmd", "configs", "scripts"]
  include_ext = ["go", "tpl", "tmpl", "html", "js", "css"]
  include_file = []
  kill_delay = 200
  log = "build-errors.log"
  poll = true
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_root = true

[color]
  app = "orange"
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true # Show timestamp in logs for better debugging
  # You can set log level via environment variable, e.g. LOG_LEVEL=debug or LOG_LEVEL=info
  # To enable debug mode in your Go app, use: air -c .air.toml -d (or set DEBUG=true)
  # Example: DEBUG=true LOG_LEVEL=debug air

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

[proxy]
  # Enable live-reloading on the browser.
  enabled = false
  proxy_port = 8090
  app_port = 8080