{{define "landing_page.html"}}
<div class="home-flex main-content-children home-layout">
  <!-- Main Dashboard Section - Torrents as the primary focus -->
  <section class="home-main" aria-labelledby="dashboard-heading">
    <!-- Torrents Section - Now primary content -->
    <div class="filebot-container full-height-container">
      <h3 class="filebot-header" role="heading">
        <span>Active Torrents</span>
        <button id="toggle-quick-actions" class="btn btn-sm toggle-button" aria-expanded="false" aria-controls="quick-actions-container">
          Show Quick Actions
        </button>
      </h3>
      <div class="filebot-content">
        <div id="torrents-widget"
             class="main-browser"
             hx-get="/deluge/torrents/htmx"
             hx-trigger="load"
             hx-swap="innerHTML"
             aria-label="Active Torrents">
          <div class="loading-indicator">Loading torrents...</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions Bar - Hidden by default, toggleable -->
    <div id="quick-actions-container" class="filebot-container compact-widget hidden">
      <h3 class="filebot-header" role="heading">
        <span>Quick Actions</span>
      </h3>
      <div class="action-bar condensed">
        <div id="library-refresh-buttons"
             class="library-refresh-container"
             hx-get="/plex/libraries/htmx?layout=horizontal&show_refresh=true&buttons_only=true"
             hx-trigger="load"
             hx-swap="innerHTML">
          <span class="loading-text">Loading...</span>
        </div>
        <div id="status-message" class="status-message status-message-improved"></div>
      </div>
    </div>
  </section>
</div>

<!-- Add Torrent Modal -->
<div id="add-torrent-modal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Torrent</h3>
      <span class="modal-close" onclick="document.getElementById('add-torrent-modal').style.display='none'">&times;</span>
    </div>
    <div class="modal-body" id="add-torrent-modal-content">
      <!-- Add torrent form will be loaded here via AJAX -->
      <div class="loading-indicator">Loading torrent form...</div>
    </div>
  </div>
</div>

<script>
  console.log('🏠 [Dashboard] landing_page.html rendered');

  // Function to handle torrent actions with confirmation
  function confirmTorrentAction(action, torrentId, torrentName) {
    const actions = {
      'pause': 'pause',
      'resume': 'resume',
      'remove': 'remove',
      'process': 'process with FileBot'
    };

    if (confirm(`Are you sure you want to ${actions[action]} torrent "${torrentName}"?`)) {
      if (action === 'process') {
        window.location.href = `/filebot/form?torrent_id=${torrentId}&mode=move`;
      } else {
        htmx.ajax('POST', `/deluge/${action}-torrent`, {
          target: '#torrents-widget',
          swap: 'innerHTML',
          values: { torrent_id: torrentId }
        });
      }
    }
  }

  // Toggle Quick Actions visibility
  document.addEventListener('DOMContentLoaded', function() {
    const toggleButton = document.getElementById('toggle-quick-actions');
    const quickActionsContainer = document.getElementById('quick-actions-container');

    toggleButton.addEventListener('click', function() {
      const isHidden = quickActionsContainer.classList.contains('hidden');

      if (isHidden) {
        quickActionsContainer.classList.remove('hidden');
        toggleButton.textContent = 'Hide Quick Actions';
        toggleButton.setAttribute('aria-expanded', 'true');
      } else {
        quickActionsContainer.classList.add('hidden');
        toggleButton.textContent = 'Show Quick Actions';
        toggleButton.setAttribute('aria-expanded', 'false');
      }
    });
  });

  // Close modal if clicking outside of it
  window.onclick = function(event) {
    const addTorrentModal = document.getElementById('add-torrent-modal');

    if (event.target == addTorrentModal) {
      addTorrentModal.style.display = 'none';
    }
  }

  // Improved status message handling
  document.addEventListener('DOMContentLoaded', function() {
    // Target for HTMX event listeners
    document.body.addEventListener('showMessage', function(event) {
      const statusEl = document.getElementById('status-message');
      if (statusEl && event.detail) {
        statusEl.textContent = event.detail.message || '';
        statusEl.className = 'status-message status-message-improved';
        if (event.detail.type) {
          statusEl.classList.add(`status-${event.detail.type}`);
        }
        // Auto-hide after 5 seconds for success messages
        if (event.detail.type === 'success') {
          setTimeout(() => {
            statusEl.textContent = '';
            statusEl.className = 'status-message status-message-improved';
          }, 5000);
        }
      }
    });

    // Enhanced sticky behavior for bulk action bars
    const handleStickyElements = function() {
      const bulkActionElements = document.querySelectorAll('.bulk-actions-bar, .filebot-bulk-actions');
      if (bulkActionElements.length > 0) {
        const scrollY = window.scrollY;
        bulkActionElements.forEach(el => {
          // Add scrolling class when scrolled
          if (scrollY > 10) {
            el.classList.add('scrolling');
          } else {
            el.classList.remove('scrolling');
          }

          // Set z-index based on position to prevent overlapping
          if (scrollY > 0) {
            el.style.zIndex = "10";
          } else {
            el.style.zIndex = "1";
          }
        });
      }
    };

    // Initialize and attach scroll event
    window.addEventListener('scroll', handleStickyElements);
    window.addEventListener('resize', handleStickyElements);
    // Initial call to set proper state
    handleStickyElements();

    // After loading torrents, we need to reapply sticky behavior
    document.body.addEventListener('htmx:afterOnLoad', function(event) {
      if (event.detail.target.id === 'torrents-widget') {
        // Find any bulk action bars in the newly loaded content
        const loadedBulkActions = event.detail.target.querySelectorAll('.bulk-actions-bar, .filebot-bulk-actions');
        if (loadedBulkActions.length > 0) {
          // Re-initialize sticky behavior
          handleStickyElements();
        }
      }
    });
  });
</script>
{{end}}
