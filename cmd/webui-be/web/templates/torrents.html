{{define "torrents"}}
{{if .Error}}
  <div class="alert alert-error" style="margin:16px">{{.Error}}</div>
{{else if not .Torrents}}
  <div class="empty">No completed torrents found.</div>
{{else}}
<div x-data style="adpadding-bottom:12px">

  <div class="table-wrap">
    <table class="torrent-table">
      <thead>
        <tr>
          <th>
            <label class="check-label">
              <input type="checkbox"
                @change="
                  $store.torrentPicks.selected = $event.target.checked ? [{{range .Torrents}}'{{.ID}}',{{end}}] : [];
                  window.Log && window.Log.debug('torrent: select-all ' + ($event.target.checked ? 'checked' : 'cleared'), { store: $store.torrentPicks.selected.slice() });
                ">
            </label>
          </th>
          <th>Name</th>
          <th>Size</th>
          <th>Progress</th>
          <th>State</th>
        </tr>
      </thead>
      <tbody>
        {{range .Torrents}}
        <tr>
          <td class="center">
            <label class="check-label">
              <input type="checkbox" value="{{.ID}}" x-model="$store.torrentPicks.selected"
                @change="window.Log && window.Log.debug(($event.target.checked ? '☑' : '☐') + ' torrent: {{.ID}}  {{.Name}}', { store: $store.torrentPicks.selected.slice() })">
            </label>
          </td>
          <td class="col-name" title="{{.Name}}">{{.Name}}</td>
          <td>{{formatBytes .Size}}</td>
          <td class="col-progress">
            <div class="progress" role="progressbar" aria-valuenow="{{printf "%.0f" .Progress}}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" style="width:{{printf "%.0f" .Progress}}%"></div>
            </div>
          </td>
          <td>
            {{if .IsFinished}}
              <span class="badge badge-success">Done</span>
            {{else}}
              <span class="badge badge-info">{{.State}}</span>
            {{end}}
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>

  <div style="padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end">
    <button
      class="btn btn-primary"
      :disabled="$store.torrentPicks.selected.length === 0"
      @click="
        const params = new URLSearchParams();
        $store.torrentPicks.selected.forEach(id => params.append('torrent_ids', id));
        htmx.ajax('GET', '/filebot?' + params.toString(), {target: '#filebot-slot', swap: 'innerHTML'});
        const dash = document.querySelector('.dashboard');
        if (dash) dash.dispatchEvent(new CustomEvent('open-drawer'));
      "
    >
      Process with FileBot
      <span x-show="$store.torrentPicks.selected.length > 0" x-text="'(' + $store.torrentPicks.selected.length + ')'" style="opacity:.8"></span>
    </button>
  </div>

</div>
{{end}}
{{end}}
