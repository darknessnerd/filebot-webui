{{define "login.html"}}
<div class="text-center">
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
        <h1>Login</h1>
        <p class="mb-2">Sign in to your account using Plex</p>
        <div style="margin: 2rem 0;">
            <a href="/auth/plex/start" id="plex-login-btn" class="btn" style="background: #282c34; color: #fff; padding: 12px 24px; font-size: 1.1rem;">
                🎬 Login with Plex
            </a>
        </div>

        <!-- Plex login status -->
        <div id="plex-error-container" style="margin-top: 1rem; color: #c00;"></div>
        <script>
        // Plex Forward Flow: Redirect to Plex Auth App for authentication
        document.getElementById('plex-login-btn').onclick = function(e) {
            e.preventDefault();
            fetch('/auth/plex/start', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    if (data && data.authAppUrl) {
                        window.location.href = data.authAppUrl;
                    } else {
                        document.getElementById('plex-error-container').innerText = 'Failed to start Plex login.';
                    }
                })
                .catch(() => {
                    document.getElementById('plex-error-container').innerText = 'Plex login failed. Please try again.';
                });
        };
        </script>

        <p style="margin-top: 2rem; font-size: 0.9rem; color: #666;">
            By logging in, you agree to our terms of service and privacy policy.
        </p>
    </div>
</div>
{{end}}
