<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — FileBot WebUI</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card" x-data="{loading: false, error: ''}">

    <div class="login-logo">
      <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4"/>
      </svg>
    </div>

    <h1 class="login-title">FileBot WebUI</h1>
    <p class="login-sub">Sign in with your Plex account to continue.</p>

    <div x-show="error" x-text="error" class="alert alert-error" style="display:none"></div>

    <button
      class="btn btn-primary login-btn"
      :disabled="loading"
      @click="
        loading = true;
        error = '';
        fetch('/auth/plex/start')
          .then(r => r.json())
          .then(d => { if (d.authAppUrl) window.location.href = d.authAppUrl; else { error = 'Failed to start auth'; loading = false; } })
          .catch(() => { error = 'Network error'; loading = false; })
      "
    >
      <span x-show="loading" class="spinner" style="width:16px;height:16px;border-width:2px"></span>
      <span x-show="!loading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
        Sign in with Plex
      </span>
    </button>

  </div>
</div>

</body>
</html>
