{{define "home.html"}}
<div class="card home-grid main-content-children">
    <div class="home-main">
        <div id="directory-browser-widget"
             class="main-browser"
             hx-get="/directory-browser"
             hx-trigger="load"
             hx-target="#directory-browser-widget"
             hx-swap="innerHTML"
             aria-label="Directory Browser">
            <span>Loading file browser...</span>
        </div>
    </div>
    <div class="side-widgets">
        <div id="filebot-form-widget"
             class="filebot-form-mini"
             hx-get="/filebot/form"
             hx-trigger="load"
             hx-target="#filebot-form-widget"
             hx-swap="innerHTML"
             aria-label="FileBot Form">
            <span>Loading FileBot form...</span>
        </div>
        <div id="plex-recently-added-widget"
             class="recently-added-mini"
             hx-get="/plex/recently-added/htmx"
             hx-trigger="load"
             hx-target="#plex-recently-added-widget"
             hx-swap="innerHTML"
             aria-label="Recently Added to Plex">
            <span>Loading recently added...</span>
        </div>
        <div id="plex-libraries-widget"
             hx-get="/plex/libraries/htmx"
             hx-trigger="load"
             hx-target="#plex-libraries-widget"
             hx-swap="innerHTML"
             aria-label="Plex Libraries">
            <span>Loading libraries...</span>
        </div>
    </div>
</div>
<script>
    console.log('🏠 [Home] home.html rendered');
</script>
{{end}}
