{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}FileBot WebUI{{end}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script>
    document.addEventListener('alpine:init', function() {
      Alpine.store('torrentPicks', { selected: [] });
    });
  </script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
    </svg>
    FileBot WebUI
  </div>
  <div class="nav-right">
    {{if .User}}
      {{if .User.PlexAvatar}}
        <img class="nav-avatar" src="{{.User.PlexAvatar}}" alt="avatar">
      {{end}}
      <span class="nav-username">{{.User.PlexUsername}}</span>
      <form method="POST" action="/auth/logout" style="margin:0">
        <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
      </form>
    {{end}}
  </div>
</nav>

<main class="main">
  {{block "content" .}}{{end}}
</main>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var COLORS=['#00e676','#69ff47','#69ff47','#4ade80'];
  function burst(x,y){
    var svg=document.createElementNS(NS,'svg');
    var R=36;
    svg.setAttribute('viewBox',-R+' '+-R+' '+(R*2)+' '+(R*2));
    svg.style.cssText='position:fixed;left:'+(x-R)+'px;top:'+(y-R)+'px;width:'+(R*2)+'px;height:'+(R*2)+'px;pointer-events:none;z-index:99999;overflow:visible;';
    var count=3+Math.floor(Math.random()*3);
    for(var i=0;i<count;i++){
      var angle=(Math.PI*2/count)*i+Math.random()*0.6;
      var dist=16+Math.random()*14;
      var nx=Math.cos(angle)*dist, ny=Math.sin(angle)*dist;
      var col=COLORS[Math.floor(Math.random()*COLORS.length)];
      var line=document.createElementNS(NS,'line');
      line.setAttribute('x1','0'); line.setAttribute('y1','0');
      line.setAttribute('x2',''+nx); line.setAttribute('y2',''+ny);
      line.setAttribute('stroke',col); line.setAttribute('stroke-width','1.5');
      line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity','0.7');
      svg.appendChild(line);
      var dot=document.createElementNS(NS,'circle');
      dot.setAttribute('cx',''+nx); dot.setAttribute('cy',''+ny);
      dot.setAttribute('r','2.5'); dot.setAttribute('fill',col);
      svg.appendChild(dot);
    }
    var hub=document.createElementNS(NS,'circle');
    hub.setAttribute('cx','0'); hub.setAttribute('cy','0');
    hub.setAttribute('r','3'); hub.setAttribute('fill','#00e676');
    svg.appendChild(hub);
    document.body.appendChild(svg);
    svg.animate(
      [{opacity:1,transform:'scale(0.4)'},{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.1)'}],
      {duration:520,easing:'ease-out',fill:'forwards'}
    ).onfinish=function(){svg.remove();};
  }
  var SKIP='a,button,input,select,textarea,label,[role="button"]';
  document.addEventListener('click',function(e){
    if(e.target.closest(SKIP)) return;
    burst(e.clientX,e.clientY);
  });
  var _tx=0,_ty=0;
  document.addEventListener('touchstart',function(e){_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(e.target.closest(SKIP)) return;
    var t=e.changedTouches[0];
    if(Math.hypot(t.clientX-_tx,t.clientY-_ty)<10) burst(t.clientX,t.clientY);
  },{passive:true});
})();
</script>
</body>
</html>
{{end}}
