{{template "base" .}}

{{define "title"}}Dashboard — FileBot WebUI{{end}}

{{define "content"}}
<div class="dashboard" x-data="{drawerOpen: false}" :class="drawerOpen ? 'drawer-open' : ''" @open-drawer="drawerOpen = true" @close-drawer="drawerOpen = false">

  <!-- Torrent panel -->
  <div class="dash-torrents">
    <div class="card dash-card">
      <div class="card-header">
        <span class="card-title">Completed Torrents</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="htmx-indicator" class="spinner"></span>
          <button
            class="btn btn-ghost btn-sm"
            hx-get="/torrents"
            hx-target="#torrent-list"
            hx-swap="innerHTML"
            hx-indicator="#htmx-indicator"
          >Refresh</button>
        </div>
      </div>
      <div
        id="torrent-list"
        class="dash-scroll"
        hx-get="/torrents"
        hx-trigger="load, every 30s"
        hx-swap="innerHTML"
        hx-indicator="#htmx-indicator"
        @htmx:after-swap="
          const ids = new Set([...document.querySelectorAll('#torrent-list input[type=checkbox][value]')].map(el => el.value));
          Alpine.store('torrentPicks').selected = Alpine.store('torrentPicks').selected.filter(id => ids.has(id));
        "
      >
        <div class="empty"><span class="spinner"></span></div>
      </div>
    </div>
  </div>

  <!-- FileBot panel -->
  <div class="dash-filebot">
    <!-- Mobile drawer handle -->
    <div class="drawer-handle" @click="drawerOpen = !drawerOpen" aria-label="Toggle FileBot panel">
      <div class="drawer-pill"></div>
    </div>
    <div id="filebot-slot" class="dash-scroll">
      <div class="card">
        <div class="card-header"><span class="card-title">FileBot</span></div>
        <div class="card-body">
          <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Select completed torrents, then click <strong style="color:var(--text)">Process with FileBot</strong>.</p>
          <div class="term-box">
            <div style="color:rgba(34,197,94,.4);margin-bottom:8px;font-size:9px;letter-spacing:.1em;">// filebot.rename</div>
            <div>
              <span style="color:rgba(34,197,94,.5);">$</span>
              <span style="color:rgba(255,255,255,.4);"> filebot -rename </span>
              <span id="fb-term-q" style="color:#4ade80;"></span><span style="color:#4ade80;animation:blink 1s step-end infinite;font-weight:bold;">_</span>
            </div>
            <div id="fb-term-results" style="min-height:72px;margin-top:12px;display:flex;flex-direction:column;gap:4px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
    (function(){
      var SCENARIOS = [
        {
          cmd: '"Inception.2010.1080p.BluRay.mkv"',
          results: [
            { color:'#22c55e', text:'TheMovieDB → Inception (2010)' },
            { color:'#4ade80', text:'rename → /media/Movies/Inception (2010)/Inception.mkv' },
            { color:'#4ade80', text:'Done ✓  1 file renamed' },
          ]
        },
        {
          cmd: '"The.Wire.S01E03.720p.mkv"',
          results: [
            { color:'#22c55e', text:'TheTVDB → The Wire — S01E03' },
            { color:'#4ade80', text:'rename → /media/TV/The Wire/Season 1/The Wire - S01E03.mkv' },
            { color:'#4ade80', text:'Done ✓  1 file renamed' },
          ]
        },
        {
          cmd: '"random.name.mkv"',
          results: [
            { color:'#f59e0b', text:'TheMovieDB → no match found' },
            { color:'#f59e0b', text:'conflict → skip (--conflict skip)' },
            { color:'#ef4444', text:'Done ✗  0 renamed, 1 skipped' },
          ]
        },
        {
          cmd: '"/downloads/Dune.Part.Two.2024.2160p"',
          results: [
            { color:'#22c55e', text:'TheMovieDB → Dune: Part Two (2024)' },
            { color:'#4ade80', text:'rename → /media/Movies/Dune Part Two (2024)/Dune Part Two.mkv' },
            { color:'#4ade80', text:'Done ✓  1 file renamed' },
          ]
        },
      ];
      var qEl = document.getElementById('fb-term-q');
      var resEl = document.getElementById('fb-term-results');
      if (!qEl || !resEl) return;
      var idx = 0;
      var timer = null;

      function dot(color) {
        var s = document.createElement('span');
        s.style.cssText = 'background:'+color+';width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px;display:inline-block;';
        return s;
      }

      function buildRow(r) {
        var row = document.createElement('div');
        row.className = 'term-result';
        row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;';
        row.appendChild(dot(r.color));
        var txt = document.createElement('span');
        txt.style.cssText = 'font-size:10px;color:rgba(220,255,220,.55);';
        txt.textContent = r.text;
        row.appendChild(txt);
        return row;
      }

      function typeText(target, text, done) {
        target.textContent = '';
        var i = 0;
        var speed = Math.max(18, Math.floor(900 / text.length));
        function tick() {
          if (!document.getElementById('fb-term-q')) return;
          target.textContent = text.slice(0, ++i);
          if (i < text.length) setTimeout(tick, speed);
          else if (done) done();
        }
        tick();
      }

      function showResults(rows, i, done) {
        if (i >= rows.length) { if (done) done(); return; }
        rows[i].classList.add('show');
        setTimeout(function(){ showResults(rows, i+1, done); }, 220);
      }

      function runScenario() {
        if (!document.getElementById('fb-term-q')) { clearInterval(timer); return; }
        var s = SCENARIOS[idx % SCENARIOS.length];
        idx++;
        resEl.innerHTML = '';
        typeText(qEl, s.cmd, function() {
          var rows = s.results.map(buildRow);
          rows.forEach(function(r){ resEl.appendChild(r); });
          setTimeout(function(){ showResults(rows, 0, null); }, 200);
        });
      }

      runScenario();
      timer = setInterval(runScenario, 4000);
    })();
    </script>
  </div>

</div>
{{end}}
