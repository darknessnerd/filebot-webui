{{define "filebot_form"}}
<div class="card" x-data="{action: '{{or .Action "move"}}', fmt: '{{or .Format "{plex}"}}', running: false}">
  <div class="card-header">
    <span class="card-title">FileBot</span>
    <span class="badge badge-info">{{len .TorrentIDs}} torrent(s)</span>
  </div>
  <div class="card-body">

    <form
      hx-post="/filebot/execute"
      hx-target="#filebot-slot"
      hx-swap="innerHTML"
      hx-indicator="#htmx-indicator"
      @htmx:before-request="running = true"
      @htmx:after-request="running = false"
    >
      {{range .TorrentIDs}}
      <input type="hidden" name="torrent_ids" value="{{.}}">
      {{end}}
      {{range .SourcePaths}}
      <input type="hidden" name="source_paths" value="{{.}}">
      {{end}}

      <div class="form-group">
        <label>Database</label>
        <select name="db" @change="fmt = '{plex}'">
          {{range $db := list "TheMovieDB" "TheMovieDB::TV" "TheTVDB" "AniDB" "AcoustID" "OMDb"}}
          <option value="{{$db}}" {{if eq $db (or $.DB "TheMovieDB")}}selected{{end}}>{{$db}}</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label>Action</label>
        <select name="action" x-model="action">
          {{range $a := list "move" "copy" "symlink" "hardlink" "test"}}
          <option value="{{$a}}" {{if eq $a (or $.Action "move")}}selected{{end}}>{{$a}}</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label>Conflict</label>
        <select name="conflict">
          {{range $c := list "skip" "replace" "auto" "index" "fail"}}
          <option value="{{$c}}" {{if eq $c (or $.Conflict "skip")}}selected{{end}}>{{$c}}</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label>Log level</label>
        <select name="log_level">
          {{range $l := list "info" "all" "fine" "warning" "off"}}
          <option value="{{$l}}" {{if eq $l (or $.LogLevel "info")}}selected{{end}}>{{$l}}</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label>Format</label>
        <input type="text" name="format" x-model="fmt" placeholder="{plex}">
        <small style="color:var(--muted);font-size:.75rem">FileBot format expression — <code>{plex}</code> uses Plex naming convention</small>
      </div>

      <div class="form-group">
        <label>Output</label>
        <input type="text" name="output" value="{{or .Output .MediaRoot}}" readonly style="opacity:.7">
      </div>

      <div class="form-group" style="flex-direction:row;align-items:center">
        <label class="checkbox-row">
          <input type="checkbox" name="recursive" value="true" {{if .Recursive}}checked{{end}}>
          Recursive (-r)
        </label>
      </div>

      <div style="display:flex;gap:10px;margin-top:6px">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center" :disabled="running">
          <span class="spinner" x-show="running" style="width:14px;height:14px;border-width:2px"></span>
          <span x-show="!running"><span class="nf nf-fa-play" aria-hidden="true"></span> Execute</span>
          <span x-show="running">Running…</span>
        </button>
        <button type="button" class="btn btn-ghost" :disabled="running"
          @click="htmx.ajax('GET', '/', {target: '#filebot-slot', swap: 'innerHTML'}); document.querySelector('.dashboard')?.dispatchEvent(new CustomEvent('close-drawer'))">
          <span class="nf nf-fa-close" aria-hidden="true"></span> Cancel
        </button>
      </div>
    </form>

  </div>
</div>
{{end}}
