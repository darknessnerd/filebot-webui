- table:
  - rowgroup:
    - row "Name Size Progress State":
      - columnheader:
        - checkbox
      - columnheader "Name"
      - columnheader "Size"
      - columnheader "Progress"
      - columnheader "State"
  - rowgroup:
    - row /The\.Matrix[\d,.]+[hmsp]+\.BluRay 8\.0 GB \d+ Done/:
      - cell:
        - checkbox
      - cell /The\.Matrix[\d,.]+[hmsp]+\.BluRay/
      - cell "8.0 GB"
      - cell /\d+/:
        - progressbar
      - cell "Done"
    - row /Breaking\.Bad\.S01E01[\d,.]+[hmsp]+ 2\.0 GB \d+ Done/:
